<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projets</title>
<style>
/* ============================================================
   Page projets. Surface page monochrome du systeme de Yan (papaye-tokens),
   inlinee pour que la page s'ouvre en file:// sans reseau ni webfont.
   Hierarchie par la taille, le poids et le blanc ; jamais par la couleur.
   Trois traits, trois roles : 1px filet, 1.6px structure, pointille = optionnel.
   Sur telephone rien ne defile en largeur : les tableaux deviennent des listes
   empilees, le rail devient un nuage de puces qui se replie, chaque groupe de
   boutons reste dans le flux et atteignable.
   ============================================================ */
:root {
  --paper: #FAFAF8; --surround: #EFEEE9; --ink: #111111; --muted: #8A8A87;
  --faint: #B8B7B1; --line: #DBDAD4; --fill: #F1F0EB;
  --f-sans: "Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
  --f-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  --hair: 1px; --struct: 1.6px;
  --sh-card: 0 1px 2px rgba(17,17,17,.03), 0 10px 30px rgba(17,17,17,.05);
  --r: 18px; --r-sm: 10px; --pad: 22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { max-width: 100%; overflow-x: hidden; }
body { background: var(--surround); color: var(--ink); font-family: var(--f-sans); font-size: 15px;
       line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 96px; min-width: 0; }
:where(p, h1, h2, h3, h4, li, td, th, span, a, button) { overflow-wrap: anywhere; }

/* --- barre du haut : titre, mise a jour, trois badges ---------------------- */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
       margin-bottom: 20px; }
.top h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.top .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
.badge { display: flex; align-items: center; gap: 10px; background: var(--paper);
         border: var(--struct) solid var(--ink); border-radius: 999px; padding: 8px 16px 8px 12px;
         box-shadow: var(--sh-card); min-width: 0; max-width: 100%; }
.badge svg { width: 20px; height: 20px; flex: none; stroke: var(--ink); fill: none;
             stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.badge b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.badge small { display: block; color: var(--muted); font-size: 11px; font-family: var(--f-mono);
               letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
.badge.soft { border-style: dashed; border-color: var(--faint); }
.notice { border: var(--hair) dashed var(--faint); border-radius: var(--r-sm); padding: 10px 14px;
          color: var(--muted); font-size: 14px; margin-bottom: 16px; }

/* --- rail + carte ---------------------------------------------------------- */
.rail { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.rail > * { min-width: 0; max-width: 100%; }
.nav { display: flex; flex-direction: column; background: var(--paper); border: var(--hair) solid var(--line);
       border-radius: var(--r); padding: 8px; box-shadow: var(--sh-card); position: sticky; top: 16px; }
.nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
              text-align: left; padding: 10px 12px; border-radius: var(--r-sm); border: var(--hair) solid transparent; }
.nav button:hover { background: var(--fill); }
.nav button.on { border-color: var(--ink); font-weight: 700; }
.nav .n { font-family: var(--f-mono); font-size: 12px; border: var(--hair) solid var(--ink); border-radius: 999px;
          padding: 1px 8px; min-width: 26px; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.nav .n.z { border-color: var(--line); color: var(--muted); }
.nav .foot { color: var(--muted); font-size: 12px; padding: 10px 12px 4px; }

.card { background: var(--paper); border: var(--struct) solid var(--ink); border-radius: var(--r);
        padding: var(--pad); box-shadow: var(--sh-card); min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 24px; flex-wrap: wrap;
        border-bottom: var(--hair) solid var(--line); padding-bottom: 14px; margin-bottom: 8px; }
.head h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.head .meta { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 14px; max-width: 62ch; min-width: 0; }
.head .deadline b { color: var(--ink); font-weight: 700; }

.bloc { border-top: var(--hair) dashed var(--line); padding: 18px 0 6px; }
.bloc:first-of-type { border-top: 0; }
/* Un bloc se replie par un bouton qui masque vraiment son corps (display none) :
   rien de replie ne garde de boite, donc rien ne peut passer sous un autre element. */
.bloc .toggle { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 0; }
.bloc .toggle::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px; border-right: var(--struct) solid var(--ink);
                        border-bottom: var(--struct) solid var(--ink); transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s; }
.bloc:not(.is-open) .toggle::before { transform: rotate(-45deg) translate(-1px, 1px); }
.bloc h3 { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
           color: var(--muted); font-weight: 400; line-height: 1.5; }
.bloc h3 b { color: var(--ink); font-weight: 700; }
.bloc .body { margin-top: 14px; }
.empty { color: var(--muted); font-style: italic; font-size: 14px; }
.sub { margin-top: 14px; }
.sub h4 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
          color: var(--muted); font-weight: 400; margin-bottom: 6px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: var(--hair) solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
tr:last-child td { border-bottom: 0; }
table.doing th:nth-child(1) { width: 52%; } table.doing th:nth-child(2) { width: 26%; } table.doing th:nth-child(3) { width: 22%; }
td .cell-label { display: none; }
td.dim { color: var(--muted); }

.tl { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tl li { padding-left: 18px; position: relative; font-size: 15px; }
.tl li::before { content: ""; position: absolute; left: 0; top: .8em; width: 10px; height: 1px; background: var(--faint); }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; border: var(--hair) solid var(--line);
       border-radius: 4px; padding: 0 6px; margin-left: 8px; color: var(--muted); vertical-align: 1px; }
.tag.ok { border-color: var(--ink); color: var(--ink); }
.src { color: var(--muted); font-size: 12px; margin-top: 8px; }
.more { margin-top: 10px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }
.more:hover { color: var(--ink); }

/* --- il manque de toi : une ligne encadree, des boutons par choix ----------- */
.you { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.you li { border: var(--struct) solid var(--ink); border-radius: var(--r-sm); padding: 10px 12px;
          display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.you .q { flex: 1 1 260px; min-width: 0; }
/* La ligne qui dit ce que la carte demande : une decision, ou un etat que le
   cerveau ne connait pas. Pointille = ce qui n'est pas su, comme ailleurs. */
.you .ask { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.you li[data-nature="etat"] .ask { width: fit-content; max-width: 100%; color: var(--ink);
                                   border-bottom: var(--hair) dashed var(--faint); padding-bottom: 2px; }
.you .btns { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.btn { border: var(--hair) solid var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--paper);
       text-align: left; max-width: 100%; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.on { background: var(--ink); color: var(--paper); }
.btn:disabled { border-color: var(--line); color: var(--faint); cursor: default; background: var(--paper); }
.you li.queued { border-style: dashed; }
.you li.queued .btn { border-color: var(--line); color: var(--muted); }
.you li.queued .btn.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.you .ok { flex-basis: 100%; color: var(--muted); font-size: 13px; display: none; }
.you li.refused { border-style: dotted; }
.you li.queued .ok, .you li.refused .ok { display: block; }
/* la case de selection reste dans le flux du titre, jamais flottante */
.you .pick { width: 15px; height: 15px; margin: 0 8px 0 0; vertical-align: -2px; accent-color: var(--ink); }
/* le lien direct vers la page d'une decision, ou le trou nomme */
.you .page { flex: 0 0 auto; font-size: 13px; }
.you .page .go { text-decoration: underline; text-underline-offset: 3px; }
.you .page .dim { color: var(--faint); font-style: italic; }
/* demander une page qui traite plusieurs decisions ensemble */
.group { margin-top: 12px; display: flex; align-items: baseline; gap: 10px 12px; flex-wrap: wrap; }
.group .make { border-width: var(--struct); }
.group .src { margin-top: 0; flex: 1 1 240px; min-width: 0; }
.group.queued .src, .group.refused .src { color: var(--ink); }

.gaps { margin-top: 22px; border-top: var(--hair) dashed var(--line); padding-top: 14px; }
.gaps h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-bottom: 8px; }
.gaps .tl li { color: var(--muted); font-size: 14px; }

.limit { margin-top: 22px; color: var(--muted); font-size: 13px; max-width: 78ch; }
.err { border: var(--struct) solid var(--ink); border-radius: var(--r); padding: var(--pad); background: var(--paper); }
.err h2 { font-size: 20px; margin-bottom: 8px; }

/* --- telephone : puces qui se replient, tableaux en listes, blocs replies --- */
@media (max-width: 720px) {
  .wrap { padding: 16px 12px 64px; }
  .top { align-items: flex-start; }
  .top h1 { font-size: 20px; }
  .badge { padding: 6px 12px 6px 10px; } .badge b { font-size: 17px; }
  .rail { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .nav { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; padding: 6px; }
  .nav button { width: auto; flex: 0 1 auto; padding: 8px 10px; }
  .nav .foot { display: none; }
  .card { padding: 16px; border-radius: 14px; }
  .head { flex-direction: column; align-items: stretch; gap: 6px; }
  .head h2 { font-size: 22px; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack thead { display: none; }
  table.stack tr { padding: 8px 0; border-bottom: var(--hair) solid var(--line); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack tr[hidden] { display: none; }
  table.stack td { padding: 3px 0; border-bottom: 0; }
  table.stack td .cell-label { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
                                text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
  .tag { display: inline-block; margin: 4px 6px 0 0; }
  .you li { align-items: stretch; }
  .you .q, .you .btns, .you .ok, .you .page { flex-basis: 100%; }
  .group { flex-direction: column; align-items: stretch; }
  .group .make { text-align: center; }
  /* en colonne, une base flex devient une HAUTEUR : la note reprend la sienne */
  .group .src { flex: 0 0 auto; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  /* Refus explicite : une page dont les donnees sont illisibles le dit,
     plutot que de ressembler a une flotte vide. */
  function renderError(msg) {
    var main = document.getElementById("pj-main");
    main.innerHTML = "";
    var box = el("div", "err");
    box.appendChild(el("h2", "", "Cette page n'a pas pu se charger"));
    box.appendChild(el("p", "", msg + ". Demande à firstmate de la régénérer."));
    main.appendChild(box);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function link(text, url, cls, refused) {
    if (!url) return el("span", cls || "", text + (refused ? " · lien refusé, hors réseau autorisé" : ""));
    var a = el("a", cls || "", text);
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    return a;
  }
  function tag(text, ok) {
    return el("span", "tag" + (ok ? " ok" : ""), text);
  }
  /* Une cellule porte son en-tete de colonne : sur telephone le tableau
     devient une liste empilee et l'en-tete s'affiche au-dessus de la valeur. */
  function cell(label, text, cls) {
    var td = el("td", cls || "");
    td.setAttribute("data-label", label);
    td.appendChild(el("span", "cell-label", label));
    if (typeof text === "string") td.appendChild(el("span", "", text)); else td.appendChild(text);
    return td;
  }
  function sub(body, title) {
    var s = el("div", "sub");
    s.appendChild(el("h4", "", title));
    body.appendChild(s);
    return s;
  }
  function utf8ByteLength(s) {
    return typeof TextEncoder === "function" ? new TextEncoder().encode(s).length : s.length;
  }
  function plural(n, one, many) { return n + " " + (n > 1 ? many : one); }

  var ICONS = {
    /* trois icones minimales, trait 1.6, monochromes */
    workers: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>',
    decisions: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m16 15 2.2 2.2L22 13"/></svg>',
    subscriptions: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 3.5"/></svg>'
  };

  var raw, data;
  try {
    raw = document.getElementById("projets-data").textContent;
    data = JSON.parse(raw);
  } catch (e) {
    renderError("Les données de la page sont illisibles");
    return;
  }
  if (!data || data.schema !== "fm-projets-board.v1" || !Array.isArray(data.projects)) {
    renderError("Les données de la page ne sont pas au format attendu");
    return;
  }

  try {
  /* --- barre du haut ------------------------------------------------------ */
  document.getElementById("pj-meta").textContent =
    "mis à jour " + data.updated_label + " · à chaque événement";
  var badges = document.getElementById("pj-badges");
  function badge(kind, value, label, soft) {
    var b = el("div", "badge" + (soft ? " soft" : ""));
    b.setAttribute("data-badge", kind);
    var ic = el("span", "ic");
    ic.innerHTML = ICONS[kind];
    b.appendChild(ic);
    var t = el("span", "");
    t.appendChild(el("b", "", value));
    t.appendChild(el("small", "", label));
    b.appendChild(t);
    badges.appendChild(b);
  }
  var bd = data.badges || {};
  badge("workers", String(bd.workers || 0), (bd.workers === 1 ? "worker en cours" : "workers en cours"));
  badge("decisions", String(bd.decisions || 0), (bd.decisions === 1 ? "décision à prendre" : "décisions à prendre"));
  badge("subscriptions", bd.subscriptions || "à mesurer", "abonnements dépensés", !bd.subscriptions);

  var notice = document.getElementById("pj-notice");
  if (data.table_missing) {
    notice.hidden = false;
    notice.textContent = "La table des projets n'est pas encore écrite : un projet par dépôt en attendant. Demande à firstmate de la remplir.";
  }
  if (data.warnings && data.warnings.length) {
    notice.hidden = false;
    notice.textContent += (notice.textContent ? " · " : "") + data.warnings.join(" · ");

  /* --- rail : ordre du payload (le composeur trie : le plus de « il manque de toi » en haut) --- */

  var hasBrain = projects.some(function (p) { return p.brain === true; });
  if (unassigned.length && !hasBrain) {

    projects.push({ id: unassignedId, name: "Sans projet", synthetic: true, items: unassigned,
      doing: [], missing_from_you: [], missing_from_others: [], pages: [], journal: [], meeting: null, gaps: [],
      costs: null });
  }
  var nav = document.getElementById("pj-nav");
  var main = document.getElementById("pj-main");
  var navButtons = [];
  projects.forEach(function (p, i) {
    var b = el("button", "");
    b.type = "button";
    b.setAttribute("data-project", p.id);
    b.appendChild(el("span", "", p.name));
    var n = p.synthetic ? p.items.length : p.missing_from_you.length;
    b.appendChild(el("span", "n" + (n ? "" : " z"), String(n)));
    b.addEventListener("click", function () { show(i); });

  });
  nav.appendChild(el("div", "foot", "Le chiffre : ce qui manque de toi. Le plus urgent en haut."));

  /* --- une carte par projet, sept blocs -------------------------------------- */
  function bloc(num, title, open) {
    var d = el("section", "bloc" + (open ? " is-open" : ""));
    d.setAttribute("data-bloc", String(num));
    d.setAttribute("data-open", open ? "true" : "false");
    var s = el("button", "toggle");
    s.type = "button";
    s.setAttribute("aria-expanded", open ? "true" : "false");
    var h = el("h3", "");
    h.appendChild(el("b", "", num + ". "));
    h.appendChild(el("span", "", title));
    s.appendChild(h);
    d.appendChild(s);
    var body = el("div", "body");
    body.hidden = !open;
    d.appendChild(body);
    s.addEventListener("click", function () {
      var opening = body.hidden;
      body.hidden = !opening;
      d.className = "bloc" + (opening ? " is-open" : "");
      d.setAttribute("data-open", opening ? "true" : "false");
      s.setAttribute("aria-expanded", opening ? "true" : "false");
    });
    return { node: d, body: body };
  }

  function renderDoing(body, rows, partial) {
    if (!rows.length) { body.appendChild(el("p", "empty", partial ? "État partiel : activité non confirmée." : "Rien en cours sur ce projet.")); return; }
    var t = el("table", "doing stack");
    var thead = el("thead", "");
    var hr = el("tr", "");
    ["Résultat", "Où ça en est", "Ensuite"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
    thead.appendChild(hr);
    t.appendChild(thead);
    var tbody = el("tbody", "");
    var hiddenRows = [];
    rows.forEach(function (r, i) {
      var tr = el("tr", "");
      tr.setAttribute("data-doing", r.id);
      tr.appendChild(cell("Résultat", link(r.result, r.url, "", r.url_refused)));
      tr.appendChild(cell("Où ça en est", r.status));
      tr.appendChild(cell("Ensuite", r.next || "rien de ton côté", r.next ? "" : "dim"));
      if (i >= 3) { tr.hidden = true; hiddenRows.push(tr); }
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    body.appendChild(t);
    if (hiddenRows.length) {
      var more = el("button", "more", "voir tout (" + rows.length + ")");
      more.type = "button";
      var shown = false;
      more.addEventListener("click", function () {
        shown = !shown;
        hiddenRows.forEach(function (tr) { tr.hidden = !shown; });
        more.textContent = shown ? "voir moins" : "voir tout (" + rows.length + ")";
      });
      body.appendChild(more);
    }
  }

  /* Les eclaireurs (scouts) enquetent pour le cerveau du projet : une liste
     a part, sous les resultats en cours. */
  function renderScouts(body, rows) {
    if (!rows || !rows.length) return;
    var s = sub(body, "Éclaireurs en cours pour le cerveau");
    var ul = el("ul", "tl");
    rows.forEach(function (r) {
      var li = el("li", "");
      li.setAttribute("data-scout", r.id);
      li.appendChild(link(r.result, r.url, "", r.url_refused));
      li.appendChild(tag(r.status));
      ul.appendChild(li);
    });
    s.appendChild(ul);
  }

  /* Ce que fait une decision - mise en file, lien direct, selection groupee -
     vit dans le bloc partage ci-dessous, injecte a l'identique dans les deux
     pages pour qu'un clic veuille dire la meme chose partout. */
/* « Il manque de toi », le seul endroit ou la page touche a une decision.
   Les deux pages (projets, a valider) injectent ce meme bloc, donc ce qu'un
   clic fait est decrit une seule fois.

   Regle du capitaine, inchangee : rien n'agit depuis la page. Un clic MET EN
   FILE un prompt Lavish et s'arrete la ; c'est le capitaine qui envoie la file
   quand il a fini, et firstmate lui repose la question en chat avant d'agir.
   Le contexte porte projet/decision/choix/nature (jamais le couple question/answer que
   l'entree a cle lit), donc meme une source liee ne pourrait rien clore.

   Deux prompts sortent d'ici :
     tag "choice"        un choix ferme sur une decision
     tag "create-lavish" une demande de page dediee pour la selection cochee
   Les deux sont des demandes, jamais des reponses enregistrees.

   Attend de la page hote : el, link, tag, utf8ByteLength. */

var SELECT_HINT = "coche une ou plusieurs décisions pour demander une page qui les traite ensemble.";

function frDay(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? m[3] + "/" + m[2] : null;
}

/* Une seule porte vers Lavish : rend true quand le prompt est bien entre dans
   la file, false sinon. La page ouverte hors Lavish n'a pas de file du tout et
   doit le dire au lieu de faire croire a un envoi. */
function queueToLavish(text, context) {
  if (!window.lavish || typeof window.lavish.queuePrompt !== "function") return false;
  if (utf8ByteLength(text) > 512) text = text.slice(0, 200);
  try {
    return window.lavish.queuePrompt(text, context) !== false;
  } catch (e) {
    return false;
  }
}

function decisionMessage(current, previous) {
  var s = "en file : " + current;
  if (previous && previous !== current) {
    s += ", à la place de " + previous
      + " (la page ne peut pas retirer une ligne déjà en file : corrige-la dans Lavish avant d'envoyer)";
  }
  return s + ". Rien n'est envoyé tant que tu n'envoies pas la file depuis Lavish, "
    + "et rien n'est clos tant que firstmate ne te l'a pas reconfirmé en chat.";
}

/* Le bloc complet d'un projet : une ligne par decision, puis le bouton de
   groupe qui demande une page dediee pour les cases cochees. */
function renderDecisions(body, project, rows) {
  var ul = el("ul", "you");
  var selected = [];

  rows.forEach(function (r) {
    var li = el("li", "");
    li.setAttribute("data-decision", r.key);
    if (r.kind) li.setAttribute("data-kind", r.kind);
    if (r.nature) li.setAttribute("data-nature", r.nature);

    var q = el("span", "q");
    var box = el("input", "pick");
    box.type = "checkbox";
    box.setAttribute("data-select", r.key);
    box.setAttribute("aria-label", "choisir cette décision pour une page dédiée");
    q.appendChild(box);
    q.appendChild(link(r.question, r.url, "", r.url_refused));
    if (r.kind) q.appendChild(tag(r.kind));
    if (r.ask) q.appendChild(el("span", "ask", r.ask));
    var since = frDay(r.since);
    if (since) q.appendChild(tag("depuis le " + since));
    li.appendChild(q);

    /* Le lien direct vers la page de la decision, ou le trou nomme : appuyer
       sur un choix sans avoir pu voir la page est exactement ce que le
       capitaine ne veut plus. */
    var open = el("span", "page");
    if (r.page && r.page.url) {
      var a = link("ouvrir la page", r.page.url, "go");
      a.setAttribute("data-page", r.key);
      open.appendChild(a);
    } else {
      open.appendChild(el("span", "dim", "pas de page dédiée"));
    }
    li.appendChild(open);

    var btns = el("div", "btns");
    var ok = el("span", "ok");
    var chosen = null;
    var buttons = [];
    r.options.forEach(function (o) {
      var b = el("button", "btn", o.label);
      b.type = "button";
      b.setAttribute("data-choice", o.value);
      b.addEventListener("click", function () {
        var text = "Projets · " + project.name + " · " + r.question + " : " + o.label;
        if (!queueToLavish(text, {
          tag: "choice", text: project.name + " : " + r.question + " -> " + o.label, element: li,
          queueKey: "projets:" + project.id + ":" + r.key,
          data: { projet: project.id, decision: r.key, choix: o.value, nature: r.nature || "decision" }
        })) {
          li.className = "refused";
          ok.textContent = "non mis en file : ouvre cette page dans Lavish";
          return;
        }
        li.className = "queued";
        ok.textContent = decisionMessage(o.label, chosen);
        chosen = o.label;
        buttons.forEach(function (other) {
          other.className = other === b ? "btn on" : "btn";
        });
      });
      buttons.push(b);
      btns.appendChild(b);
    });
    li.appendChild(btns);
    li.appendChild(ok);

    box.addEventListener("change", function () {
      var at = selected.indexOf(r);
      if (box.checked && at < 0) selected.push(r);
      else if (!box.checked && at >= 0) selected.splice(at, 1);
      refresh();
    });
    ul.appendChild(li);
  });
  body.appendChild(ul);

  /* Demander UNE page qui traite plusieurs decisions ensemble. La page ne
     fabrique rien : elle met la demande en file, firstmate la reprend en chat. */
  var group = el("div", "group");
  var make = el("button", "btn make", "créer une page Lavish pour la sélection");
  make.type = "button";
  make.setAttribute("data-create-lavish", project.id);
  make.disabled = true;
  var count = el("span", "src", SELECT_HINT);
  function refresh() {
    make.disabled = selected.length === 0;
    count.textContent = selected.length === 0
      ? SELECT_HINT
      : selected.length + (selected.length > 1 ? " décisions sélectionnées." : " décision sélectionnée.");
  }
  make.addEventListener("click", function () {
    if (!selected.length) return;
    var titres = selected.map(function (r) { return r.question; });
    var text = "Projets · " + project.name + " · créer une page Lavish pour : " + titres.join(" ; ");
    if (!queueToLavish(text, {
      tag: "create-lavish", text: project.name + " : page à créer pour " + selected.length + " décision(s)",
      element: group, queueKey: "projets:create-lavish:" + project.id,
      data: { projet: project.id, decisions: selected.map(function (r) { return r.key; }), titres: titres }
    })) {
      group.className = "group refused";
      count.textContent = "non mis en file : ouvre cette page dans Lavish";
      return;
    }
    group.className = "group queued";
    count.textContent = "demande en file pour " + selected.length + (selected.length > 1 ? " décisions" : " décision")
      + ". Rien n'est fabriqué tant que tu n'envoies pas la file depuis Lavish, "
      + "et firstmate te reposera la question en chat avant de lancer le travail.";
  });
  group.appendChild(make);
  group.appendChild(count);
  body.appendChild(group);
}

  function renderYou(body, project) {
    var rows = project.missing_from_you;
    if (!rows.length) { body.appendChild(el("p", "empty", project.partial ? "État partiel : décisions non confirmées." : "Rien ne manque de toi sur ce projet.")); return; }
    renderDecisions(body, project, rows);
  }

  function renderOthers(body, rows) {
    if (!rows.length) { body.appendChild(el("p", "empty", "Aucune attente des autres n'est enregistrée.")); return; }
    var ul = el("ul", "tl");
    rows.forEach(function (r) {
      var li = el("li", "");
      li.appendChild(el("b", "", r.who + " : "));
      li.appendChild(el("span", "", r.what));
      if (r.tag) li.appendChild(tag(r.tag));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  function renderPages(body, rows, brain) {
    if (!rows.length) { body.appendChild(el("p", "empty", brain ? "Aucune page du cerveau n'est enregistrée." : "Aucune page de gestion n'est enregistrée.")); return; }
    var ul = el("ul", "tl");
    rows.forEach(function (r) {
      var li = el("li", "");
      li.appendChild(link(r.label, r.url, "", r.url_refused));
      if (r.state) li.appendChild(tag(r.state, /à jour|publié/.test(r.state)));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  /* Les creations (pages, films, supports produits) : ce que le projet a
     fabrique et qui se montre. */
  function renderCreations(body, rows) {
    if (!rows || !rows.length) return;
    var s = sub(body, "Créations");
    var ul = el("ul", "tl");
    rows.forEach(function (r) {
      var li = el("li", "");
      li.setAttribute("data-creation", r.label);
      li.appendChild(link(r.label, r.url, "", r.url_refused));
      if (r.kind) li.appendChild(tag(r.kind));
      ul.appendChild(li);
    });
    s.appendChild(ul);
  }

  function renderCosts(body, costs) {
    var c = costs || { period: "ce mois", tokens_api: null, subscription_share: null, source: "" };
    var t = el("table", "stack");
    var thead = el("thead", "");
    var hr = el("tr", "");
    ["Jetons, valeur API", "Part de tes abonnements"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
    thead.appendChild(hr);
    t.appendChild(thead);
    var tbody = el("tbody", "");
    var tr = el("tr", "");
    tr.appendChild(cell("Jetons, valeur API", c.tokens_api || "à mesurer", c.tokens_api ? "" : "dim"));
    tr.appendChild(cell("Part de tes abonnements", c.subscription_share || "à mesurer", c.subscription_share ? "" : "dim"));
    tbody.appendChild(tr);
    t.appendChild(tbody);
    body.appendChild(t);
    if (c.source) body.appendChild(el("div", "src", c.source));
  }

  function renderJournal(body, rows) {
    if (!rows.length) { body.appendChild(el("p", "empty", "Aucun événement récent.")); return; }
    var ul = el("ul", "tl");
    rows.forEach(function (r) {
      var li = el("li", "");
      if (r.when) li.appendChild(el("span", "", r.when + " · "));
      li.appendChild(link(r.what, r.url, "", r.url_refused));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  function frDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "/" + m[2] : iso;
  }
  function renderMeeting(body, m, available) {
    if (!m) { body.appendChild(el("p", "empty", available ? "Aucune reunion a venir dans ton agenda pour ce projet" : "Agenda non lu : fichier absent ou vieux de plus d’un jour")); return; }
    var ul = el("ul", "tl");
    var li = el("li", "");
    li.appendChild(el("b", "", m.title + ", " + frDate(m.date)));
    if (m.time) li.appendChild(el("span", "", " à " + m.time));
    if (m.source) li.appendChild(el("span", "", " · " + m.source));
    if (m.with) li.appendChild(el("span", "", " avec " + m.with));
    ul.appendChild(li);
    if (m.bring && m.bring.length) ul.appendChild(el("li", "", "À emporter : " + m.bring.join(", ")));
    if (m.decide && m.decide.length) ul.appendChild(el("li", "", "À décider : " + m.decide.join(", ")));
    body.appendChild(ul);
  }

  function renderUnassigned(body, items, brain) {
    if (!items.length) { body.appendChild(el("p", "empty", "Tout est rattaché à un projet.")); return; }
    var ul = el("ul", "tl");
    items.forEach(function (it) {
      var li = el("li", "", it.what);
      li.setAttribute("data-unlinked", it.id);
      ul.appendChild(li);
    });
    body.appendChild(ul);
    body.appendChild(el("div", "src", plural(items.length, "élément à rattacher", "éléments à rattacher") + " à un projet : c'est ce que le cerveau ne sait pas encore ranger" + (brain ? ", firstmate te proposera un rangement" : "") + "."));
  }

  function renderQuickWins(body, items) {
    if (!items || !items.length) { body.appendChild(el("p", "empty", "Aucun quick win enregistré pour le cerveau.")); return; }
    var ul = el("ul", "tl");
    items.forEach(function (s) { ul.appendChild(el("li", "", s)); });
    body.appendChild(ul);
  }

  function card(p) {
    var c = el("section", "card");
    c.setAttribute("data-project", p.id);
    if (p.brain) c.setAttribute("data-brain", "true");
    var head = el("div", "head");
    head.appendChild(el("h2", "", p.name));
    var meta = el("div", "meta");
    if (p.deadline) {
      var d = el("div", "deadline", "Prochaine échéance : ");
      d.appendChild(el("b", "", p.deadline.label + ", " + frDate(p.deadline.date)));
      meta.appendChild(d);
    }
    if (p.team) meta.appendChild(el("div", "team", p.team));
    if (p.headline) meta.appendChild(el("div", "headline", p.headline));
    if (meta.children.length) head.appendChild(meta);
    c.appendChild(head);

    if (p.synthetic) {
      var b0 = bloc(0, "sans projet", true);
      renderUnassigned(b0.body, p.items, false);
      c.appendChild(b0.node);
      return c;
    }

    var narrow = typeof window !== "undefined" && window.innerWidth && window.innerWidth <= 720;
    var b1 = bloc(1, "On est en train de", !narrow); renderDoing(b1.body, p.doing, p.partial); renderScouts(b1.body, p.scouts); c.appendChild(b1.node);
    var b2 = bloc(2, "Il manque de toi", true); renderYou(b2.body, p); c.appendChild(b2.node);
    if (p.brain) {
      var b3b = bloc(3, "Pas encore rattaché à un projet", !narrow); renderUnassigned(b3b.body, p.unlinked || [], true); c.appendChild(b3b.node);
      var b4b = bloc(4, "Pages du cerveau", !narrow); renderPages(b4b.body, p.pages, true); renderCreations(b4b.body, p.creations); c.appendChild(b4b.node);
    } else {
      var b3 = bloc(3, "Il manque des autres", !narrow); renderOthers(b3.body, p.missing_from_others); c.appendChild(b3.node);
      var b4 = bloc(4, "Pages de gestion", !narrow); renderPages(b4.body, p.pages, false); renderCreations(b4.body, p.creations); c.appendChild(b4.node);
    }
    var b5 = bloc(5, "Coûts du mois (" + ((p.costs && p.costs.period) || "ce mois") + ")", !narrow); renderCosts(b5.body, p.costs); c.appendChild(b5.node);
    var b6 = bloc(6, "Journal, les 5 derniers événements", !narrow); renderJournal(b6.body, p.journal); c.appendChild(b6.node);
    if (p.brain) {
      var b7b = bloc(7, "Quick wins du cerveau", !narrow); renderQuickWins(b7b.body, p.quick_wins); c.appendChild(b7b.node);
    } else {
      var b7 = bloc(7, "Prochaine réunion et sa préparation", !narrow);
      (p.meetings && p.meetings.length ? p.meetings : [p.meeting]).forEach(function (m) { renderMeeting(b7.body, m, p.agenda_available); });
      /* l'etat vide dit deja qu'aucun agenda n'a ete lu ; l'avertissement ne
         se repete que lorsqu'une reunion est affichee */
      if (p.meeting_warning && p.meetings && p.meetings.length) b7.body.appendChild(el("p", "src", p.meeting_warning));
      b7.body.appendChild(el("p", "src", "La prochaine reunion est lue depuis ton agenda ; ce qui n'y est pas n'y entre pas encore."));
      c.appendChild(b7.node);
    }

    if (p.gaps && p.gaps.length) {
      var g = el("div", "gaps");
      g.appendChild(el("h3", "", "Ce que le cerveau ne sait pas encore"));
      var ul = el("ul", "tl");
      p.gaps.forEach(function (s) { ul.appendChild(el("li", "", s)); });
      g.appendChild(ul);
      c.appendChild(g);
    }
    return c;
  }

  var cards = projects.map(card);
  cards.forEach(function (c) { main.appendChild(c); });

  var active = 0;
  function show(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    navButtons.forEach(function (b, j) { b.className = j === active ? "on" : ""; });
    if (typeof history !== "undefined" && history.replaceState && projects[active]) {
      try { history.replaceState(null, "", "#" + projects[active].id); } catch (e) { /* file:// */ }
    }
  }
  if (!cards.length) {
    main.appendChild(el("p", "empty", "Aucun projet à afficher."));
  } else {
    var start = 0;
    if (typeof location !== "undefined" && location.hash) {
      var want = location.hash.slice(1);
      projects.forEach(function (p, i) { if (p.id === want) start = i; });
    }
    show(start);
  }
  } catch (e) {
    renderError("La page n'a pas pu être dessinée");
  }
})();
</script>
</body>
</html>
